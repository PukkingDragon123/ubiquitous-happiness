<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="screen-orientation" content="landscape" />
  <title>Blobfish: Reel Rebellion</title>
  <style>
    @font-face { font-family: 'Alagard'; src: url('./fonts/alagard.ttf') format('truetype'); font-display: block; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b111c; }
    body { cursor: none; user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    canvas#game { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #0b111c; transition: opacity .8s ease; z-index: 5; }
    #boot canvas { image-rendering: pixelated; width: 384px; height: 192px; }
    #boot.gone { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="boot"><canvas id="bootcv" width="128" height="64"></canvas></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
